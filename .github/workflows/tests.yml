name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pyfold check examples/original.py
      - run: python -m pyfold check examples/readable.fold --map examples/readable.fold.map.json --against examples/original.py --json
      - run: python -m pyfold check examples/project/views --map examples/project/project.map.json --against examples/project/python --json
