[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfold-lang"
version = "0.1.0"
description = "A concise authoring view of Python with a lossless reconstruction sidecar"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pyfold = "pyfold.__main__:main"

[tool.setuptools.packages.find]
include = ["pyfold*"]
